version: 2
updates:
  # SHA-pinned actions do not drift on their own — they rot instead, and a
  # workflow fixed in one repo stops transplanting into the next. Dependabot
  # bumps the pin and the trailing version comment together, which is the only
  # form of this rule that survives contact with a quiet month.
  #
  # No `ignore` for dtolnay/rust-toolchain, deliberately. That exclusion is for
  # a pin where the version *is* the ref (`@1.88.0`), which an update would
  # move. Here the ref is a SHA and the toolchain is an input, so bumping the
  # action cannot change which compiler the MSRV job runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
