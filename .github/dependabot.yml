version: 2
updates:
  # SHA-pinned actions do not drift on their own — they rot instead, and a
  # workflow fixed in one repo stops transplanting into the next. Dependabot
  # bumps the pin and the trailing version comment together, which is the only
  # form of this rule that survives contact with a quiet month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The one pin that must NOT track upstream. This action selects the
      # toolchain, so bumping it moves the MSRV job onto current stable — the
      # job stays green while testing a floor the crate never declared, which
      # is silent decay of the exact thing it exists to catch. Move it by hand,
      # together with Cargo.toml's rust-version.
      - dependency-name: dtolnay/rust-toolchain
