name: Release

on:
  push:
    tags:
      - 'v*'

# Read at the top; the one job that has to create a release asks for write
# itself. A blanket write across the workflow because one step needed it is
# exactly what this split prevents.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: swaykeys-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            artifact: swaykeys-aarch64-linux

    steps:
      # Pinned to a commit, never a tag: a tag is mutable, and in the
      # tj-actions/changed-files compromise (CVE-2025-30066) every tag was
      # repointed at a commit that dumped CI secrets into the logs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # A prebuilt release binary rather than `cargo install`, which re-resolves
      # cargo-zigbuild's own dependency tree on every run and can break a release
      # with no change on our side.
      - name: Install cargo-zigbuild
        run: pip install ziglang
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-zigbuild

      # glibc, not musl: libxkbcommon is loaded with dlopen, which a fully
      # static binary cannot do. Pinning the glibc version keeps the binaries
      # usable on distributions older than the runner.
      - name: Build
        run: cargo zigbuild --target ${{ matrix.target }}.2.28 --release --locked

      - name: Stage binary
        run: cp "target/${{ matrix.target }}/release/swaykeys" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes anything.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # tar preserves the exec bit that upload-artifact and bare gzip drop.
      # Loop + glob so adding a target means editing only the build matrix.
      - name: Package and checksum
        working-directory: dist
        run: |
          for f in swaykeys-*; do
            install -m755 "$f" swaykeys
            tar -czf "$f.tar.gz" swaykeys
            rm -f swaykeys "$f"
          done
          sha256sum -- *.tar.gz > SHA256SUMS
          ls -la

      - name: Publish release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
