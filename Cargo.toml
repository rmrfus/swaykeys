[package]
name = "swaykeys"
version = "0.1.1"
edition = "2024"
description = "Help sheet for every active sway key binding"
homepage = "https://github.com/rmrfus/swaykeys"
repository = "https://github.com/rmrfus/swaykeys"
license = "MIT"
# The floor is set by ratatui 0.30, not by our own code. It is not cosmetic:
# clippy gates its suggestions on it, `incompatible_msrv` fires against it, and
# the resolver picks dependency versions that respect it — so a floor that lies
# is worse than none. CI builds it on that exact toolchain.
rust-version = "1.88"

[dependencies]
# Not trimmed for bytes — this crate does not claim to watch its size, and the
# honest saving is 8 KB of 1.5 MB (measured, Cargo.lock restored between runs).
# It is trimmed because dropping `color` takes the whole anstream stack out of
# the graph, and anstream is a second opinion about colour inside this process:
# it is the entire reason `NO_COLOR=` could leave our sheet monochrome while
# clap's --help stayed coloured. Gone, `want_color` in main.rs is the only one.
#
# `error-context` and `suggestions` are kept on purpose. Without the first a bad
# flag gets "unexpected argument found" without naming it; without the second
# there is no "a similar argument exists: '--color'" and `Usage:` degrades from
# the real invocation to a bare [OPTIONS]. Together they are 20 of the 28 KB the
# trim would otherwise return, which is the trade taken here.
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
glob = "0.3"
nucleo-matcher = "0.3.1"
# Re-exports crossterm, so terminal size, raw mode and key events all come
# from here — no second terminal crate.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dlopen'd rather than linked: the binary stays usable on a host without
# libxkbcommon (bindcode display and shadow detection degrade, nothing breaks),
# and there is no C dependency at build time.
xkbcommon-dl = "0.4"

# The no-panic policy, machine-checked. These live in clippy's `restriction`
# group, which is allow-by-default and is *not* switched on by `clippy::all` or
# `pedantic` — each has to be named. `warn` plus the `-D warnings` CI already
# passes is what makes them fail the build.
#
# The table rather than a crate-level `#![deny]` because it also reaches
# `tests/`, which are separate crates an attribute in `main.rs` never touches.
# `clippy.toml` exempts test functions either way.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# The four below are what make the rest of the house rules more than prose:
# `exit` enforces `fn main() -> ExitCode`, `print_stdout` the "payload goes
# through write_all, so `swaykeys | head` does not panic" rule, and the two
# unsafe ones the SAFETY-comment rule in xkb.rs.
exit = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
lto = true
strip = true
