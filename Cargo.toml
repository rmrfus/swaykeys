[package]
name = "swaykeys"
version = "0.1.0"
edition = "2021"
description = "Help sheet for every active sway key binding"
homepage = "https://github.com/rmrfus/swaykeys"
repository = "https://github.com/rmrfus/swaykeys"
license = "MIT"
# The floor is set by ratatui 0.30, not by our own code. It is not cosmetic:
# clippy gates its suggestions on it, `incompatible_msrv` fires against it, and
# the resolver picks dependency versions that respect it — so a floor that lies
# is worse than none. CI builds it on that exact toolchain.
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
nucleo-matcher = "0.3.1"
# Re-exports crossterm, so terminal size, raw mode and key events all come
# from here — no second terminal crate.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dlopen'd rather than linked: the binary stays usable on a host without
# libxkbcommon (bindcode display and shadow detection degrade, nothing breaks),
# and there is no C dependency at build time.
xkbcommon-dl = "0.4"

[profile.release]
lto = true
strip = true
